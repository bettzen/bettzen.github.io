baseURL = 'https://bettzen.com/'
theme = "blowfish"
title = "深圳百陈服装有限公司 | Bettzen"
defaultContentLanguage = "en"
[taxonomies]
  tag = "tags"
  category = "categories"
publishDir = "docs"
[params]
  enableSRI = false
[markup.goldmark.renderer]
  unsafe = true
 [sitemap]
  filename = "sitemap.xml"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

[languages.en]
  languageName = "English"
  languageCode = "en"
  weight = 1
  [languages.en.params]
    displayName = "English"

[languages.zh]
  languageName = "简体中文"
  languageCode = "zh"
  weight = 2
  [languages.zh.params]
    displayName = "简体中文"