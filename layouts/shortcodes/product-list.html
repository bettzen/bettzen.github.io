<div class="product-grid">
  {{ range where .Site.RegularPages "Section" "products" }}
    {{ if ne .Title "Products" }}
      <div class="product-card">
        <a href="{{ .RelPermalink }}">
          <img src="{{ .Params.image | default "/images/default.jpg" }}" alt="{{ .Title }}" loading="lazy">
          <h3>{{ .Title }}</h3>
        </a>
      </div>
    {{ end }}
  {{ end }}
</div>
