{{ define "main" }}
  <header>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="product-grid">
    {{ range .Pages }}
      <div class="product-card">
        <a href="{{ .RelPermalink }}">
          <img src="{{ .Params.image | default "/images/default.jpg" }}" alt="{{ .Title }}" loading="lazy">
          <h3>{{ .Title }}</h3>
        </a>
      </div>
    {{ end }}
  </div>
{{ end }}
